<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry</title>
  <link rel="stylesheet" href="style.css">

  Font Awesome for icons 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="enquiry-container">

    
    <div class="contact-info">
      <h3>Contact Information</h3>
      <p>Fill up the form and our team will get back to you within 24 hours.</p>

      <div class="info-box">
        <i class="fa-solid fa-phone"></i> <span>+27 123 456 789</span>
      </div>
      <div class="info-box">
        <i class="fa-solid fa-envelope"></i> <span>info@healingminds.org</span>
      </div>
      <div class="info-box">
        <i class="fa-solid fa-globe"></i> <span>www.healingminds.org</span>
      </div>

      <div class="social-icons">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
      </div>
    </div>

    
    <div class="enquiry-form">
      <h3>Send us a message</h3>

      <form action="#">
        <div class="form-row">
          <input type="text" placeholder="First Name" required>
          <input type="text" placeholder="Last Name" required>
        </div>

        <div class="form-row">
          <input type="email" placeholder="Email" required>
          <input type="text" placeholder="Phone" required>
        </div>

        <textarea rows="5" placeholder="Write your message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
       

    </div>

  </div>
   <a href="contacts.html">Contact page</a>


</body>
</html>
