<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry</title>
</head>
<body>
    <h3>Enquiry form</h3>
    <p>
        Please fill out the form below for any enquires regarding the organisation, if you want to be a sponsor or volunteer.
    </p>

    <form action="#">
        <div class="user-details">
            <div class="input-box">
                <span class="details">Full Name</span>
                <input type="text" placeholder="Enter your name" required>
            </div>
        </div>
        <div class="user-details">
            <div class="input-box">
                <span class="details">Surname</span>
                <input type="text" placeholder="Enter your surname" required>
            </div>
        </div>
        <div class="user-details">
            <div class="input-box">
                <span class="details">Email</span>
                <input type="text" placeholder="Enter your email" required>
            </div>
        </div>
        <div class="user-details">
            <div class="input-box">
                <span class="details">Phone number</span>
                <input type="text" placeholder="Enter your phone number" required>
            </div>
        </div>
        <div class="user-details">
            <div class="input-box">
                <span class="details">Volunteer or Sponsor</span>
                <input type="text" placeholder="volunteer or sponsor" required>
            </div>
        </div>
    </form>
    <br>
    <textarea rows="5" cols="60" name="message" placeholer="Enter text" autocomplete="off" required></textarea>
    <button type="submit">Send Message</button>

    <br>
    <a href="contact.html">Contact page</a>

    
</body>
</html>
