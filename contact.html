<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="contact-container">
    <!-- LEFT INFO -->
    <div class="contact-info">
      <h3>Contact Details</h3>
      <div class="info-box"><i class="fa-solid fa-location-dot"></i> 678 Nelson Mandela Drive, Port Elizabeth, 6001</div>
      <div class="info-box"><i class="fa-solid fa-location-dot"></i> 890 Rondebosch Street, Rondebosch, 7700</div>
      <div class="info-box"><i class="fa-solid fa-phone"></i> 011 254 6571</div>
      <div class="info-box"><i class="fa-solid fa-envelope"></i> Healingmindsorganisation@gmail.com</div>
    </div>

    <!-- MIDDLE FORM -->
    <div class="contact-form">
      <h3>Contact Us</h3>
      <form class="contact" action="" method="post">
        <input type="text" name="name" class="text-box" placeholder="Your Name" required>
        <input type="email" name="email" class="text-box" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <input type="submit" name="submit" class="send-button" value="Send">
      </form>
    </div>

    <!-- MAPS ON THE SIDE -->
     <div class="contact-maps">
      <h4>Our Locations</h4>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d149832.64127201028!2d25.399312430356954!3d-33.918876593731945!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e7ad3d26d86361b%3A0xf546d9332870dab0!2sThe%20IIE&#39;s%20Varsity%20College%20-%20Nelson%20Mandela%20Bay!5e0!3m2!1sen!2sza!4v1756304252948!5m2!1sen!2sza" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3308.9787441584704!2d18.461517075079808!3d-33.967385824170734!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc5d2e04454a23%3A0x69e3fabf15ed814a!2sRondebosch%20Guest%20House!5e0!3m2!1sen!2sza!4v1756304505399!5m2!1sen!2sza" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <div class="back-home">
    <a href="index.html">← Back to Homepage</a>
  </div>

</body>
</html>
